[project]
name = "omnitalk-qwen3-omni-baseline"
version = "0.1.0"
description = "Qwen3-Omni-30B-A3B baseline on OmniTalk multiple-choice questions, with vLLM"
requires-python = "==3.12.*"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# Direct dependencies of the GPU run. requirements.lock.txt pins the complete environment.
inference = [
    "vllm==0.33.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torchaudio==2.11.0",
    "transformers==5.20.2",
    "qwen-omni-utils==0.0.9",
    "librosa==0.11.0",
    "soundfile==0.14.0",
    "decord==0.6.0",
    "av==19.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
